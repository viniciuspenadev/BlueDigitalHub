server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Oculta a versão do nginx nos headers/erros
    server_tokens off;

    # Headers de segurança (aplicados a todas as respostas)
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Compressão
    gzip on;
    gzip_vary on;
    gzip_min_length 256;
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml;

    # Assets do Astro (nomes com hash) → cache longo e imutável.
    # `^~` garante prioridade sobre o bloco regex de assets abaixo,
    # senão os .js/.css cairiam nas regras de 30d em vez de 1 ano.
    location ^~ /_astro/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Demais estáticos → cache moderado (o `expires` já emite o Cache-Control)
    location ~* \.(?:js|css|woff2?|ttf|eot|png|jpe?g|gif|webp|avif|svg|ico)$ {
        expires 30d;
        try_files $uri =404;
    }

    # Páginas (MPA estático com URLs em diretório: /servicos/xxx/)
    # $uri  → arquivo exato
    # $uri/ → diretório (redireciona p/ barra final e serve index.html)
    # =404  → não encontrado: cai no error_page abaixo (status 404 real)
    location / {
        try_files $uri $uri/ =404;
    }

    # Página 404 com branding (gerada por src/pages/404.astro), com status 404 correto
    error_page 404 /404.html;
}
